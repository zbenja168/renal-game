<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renal Bricks — Interactive Study Games</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1>Renal Bricks</h1>
  <p>Interactive games to reinforce the renal system curriculum, one brick at a time.</p>
</header>

<main class="container">
  <h2 style="margin-bottom: 6px; font-size: 1.4rem;">Week 1 Modules</h2>
  <p style="color: #5a6473; margin-bottom: 4px;">All 21 bricks. Each module has 6 short games covering its learning objectives, capped by a comprehensive boss round.</p>

  <div class="module-grid" id="moduleGrid"></div>
</main>

<footer>
  Built from the Brick Exchange source material. Educational use.
</footer>

<script>
  const modules = [
    { num: 1,  title: "Anatomy of the Urinary System",                              games: 6, ready: true },
    { num: 2,  title: "Development of the Urinary System",                          games: 6, ready: true },
    { num: 3,  title: "Congenital Disorders of the Kidney",                         games: 6, ready: true },
    { num: 4,  title: "Histology of the Renal Corpuscle and Renal Tubular System",  games: 6, ready: true },
    { num: 5,  title: "Glomerular Function",                                        games: 6, ready: true },
    { num: 6,  title: "Glomerular Filtration Rate (GFR)",                           games: 6, ready: true },
    { num: 7,  title: "Renal Clearance",                                            games: 6, ready: true },
    { num: 8,  title: "Regulation of Renal Blood Flow",                             games: 6, ready: true },
    { num: 9,  title: "Nephron Segmental Physiology",                               games: 6, ready: true },
    { num: 10, title: "Sodium Homeostasis",                                         games: 6, ready: true },
    { num: 11, title: "Potassium Homeostasis",                                      games: 6, ready: true },
    { num: 12, title: "Loop Diuretics",                                             games: 6, ready: true },
    { num: 13, title: "Thiazide Diuretics",                                         games: 6, ready: true },
    { num: 14, title: "Osmotic Diuretics",                                          games: 6, ready: true },
    { num: 15, title: "Potassium-Sparing Diuretics",                                games: 6, ready: true },
    { num: 16, title: "Composition of Body Fluids and Compartments",                games: 6, ready: true },
    { num: 17, title: "Water Regulation",                                           games: 6, ready: true },
    { num: 18, title: "Hyponatremia",                                               games: 6, ready: true },
    { num: 19, title: "Hypernatremia",                                              games: 6, ready: true },
    { num: 20, title: "Antidiuretic Hormone Agonists",                              games: 6, ready: true },
    { num: 21, title: "Antidiuretic Hormone Receptor Antagonists",                  games: 6, ready: true }
  ];

  const grid = document.getElementById("moduleGrid");
  modules.forEach(m => {
    const numStr = String(m.num).padStart(2, "0");
    const card = document.createElement(m.ready ? "a" : "div");
    card.className = "module-card" + (m.ready ? "" : " disabled");
    if (m.ready) card.href = `modules/${numStr}/index.html`;
    card.innerHTML = `
      <span class="badge ${m.ready ? "ready" : "soon"}">${m.ready ? "Ready" : "Soon"}</span>
      <div class="num">Module ${numStr}</div>
      <h3>${m.title}</h3>
      <div class="meta">${m.ready ? `${m.games} games` : "Coming soon"}</div>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
